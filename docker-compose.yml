# Môi trường dev. Postgres chạy cổng 5433 để không đụng Postgres cài sẵn trên máy (5432).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem_dev
      POSTGRES_DB: tandem
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
